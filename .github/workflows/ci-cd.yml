name: ci-cd

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Run tests
        run: ./gradlew check --rerun-tasks

      # NEW: Upload built JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # NEW: Download the JAR file
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./artifact

      - name: Rename the jar-file.
        run: mv *.jar app.jar

      # Upload JAR to the server
      - name: Upload jar via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./artifact/*.jar"
          strip_components: 1
          target: "/root/cicd"
      - name: Run on server
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: systemctl restart hw.service