name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Использовать Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradlew сдеть исполняемым файлом.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Собрсть JAR
      - name: Build with Gradle
        run: ./gradlew bootJar

      # 5. Запустить тесты
      - name: Run tests wалith Gradle
        id: tests
        run: ./gradlew check --rerun-tasks

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ success() }}        # Только если предыдущий шаг успешен.
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/cicd
            git pull
            sudo systemctl restart hw.service
